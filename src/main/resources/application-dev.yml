# ====================================================================================
# application-dev.yml —— 开发环境覆盖配置
# ====================================================================================
# 当 application.yml 里 spring.profiles.active=dev 时，本文件被加载，
# 同名配置覆盖主文件。这样开发/生产可以有不同的日志级别、数据源等。
# ====================================================================================

logging:
  level:
    root: INFO                        # 根日志级别
    com.example.test1: DEBUG          # 项目代码打 DEBUG，方便排查
    org.springframework.web: INFO     # Spring Web 框架日志
